<text x="424.4" y="47.0" text-anchor="middle" fill="#9fb0c8" font-family="-apple-system, 'Helvetica Neue', sans-serif" font-size="13">ls /Library</text>
<text x="50.0" y="82.5" xml:space="preserve" fill="#5af78e" font-family="'Nordwand Mono', Menlo, monospace" font-size="13" font-weight="bold">$ </text>
<text x="65.6" y="82.5" xml:space="preserve" fill="#eff0eb" font-family="'Nordwand Mono', Menlo, monospace" font-size="13" font-weight="bold">ls /Library/{LaunchAgents,LaunchDaemons,PrivilegedHelperTools} | grep -iE 'microsoft|:$'</text>
<text x="50.0" y="101.0" xml:space="preserve" fill="#57c7ff" font-family="'Nordwand Mono', Menlo, monospace" font-size="13">/Library/LaunchAgents:</text>
<text x="50.0" y="119.5" xml:space="preserve" fill="#eff0eb" font-family="'Nordwand Mono', Menlo, monospace" font-size="13">com.microsoft.update.agent.plist</text>
<text x="50.0" y="138.0" xml:space="preserve" fill="#57c7ff" font-family="'Nordwand Mono', Menlo, monospace" font-size="13">/Library/LaunchDaemons:</text>
<text x="50.0" y="156.5" xml:space="preserve" fill="#eff0eb" font-family="'Nordwand Mono', Menlo, monospace" font-size="13">com.microsoft.autoupdate.helper.plist</text>
<text x="50.0" y="175.0" xml:space="preserve" fill="#57c7ff" font-family="'Nordwand Mono', Menlo, monospace" font-size="13">/Library/PrivilegedHelperTools:</text>
<text x="50.0" y="193.5" xml:space="preserve" fill="#eff0eb" font-family="'Nordwand Mono', Menlo, monospace" font-size="13">com.microsoft.autoupdate.helper</text>
<text x="50.0" y="212.0" xml:space="preserve" fill="#5af78e" font-family="'Nordwand Mono', Menlo, monospace" font-size="13" font-weight="bold">$ </text>
<text x="65.6" y="212.0" xml:space="preserve" fill="#eff0eb" font-family="'Nordwand Mono', Menlo, monospace" font-size="13" font-weight="bold">plutil -p /Library/LaunchAgents/com.microsoft.update.agent.plist | grep -E 'RunAt|Interval'</text>
<text x="50.0" y="230.5" xml:space="preserve" fill="#eff0eb" font-family="'Nordwand Mono', Menlo, monospace" font-size="13">  "RunAtLoad" =&gt; true</text>
<text x="50.0" y="249.0" xml:space="preserve" fill="#eff0eb" font-family="'Nordwand Mono', Menlo, monospace" font-size="13">  "StartInterval" =&gt; 7200</text>
